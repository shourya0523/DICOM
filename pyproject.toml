[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dicom-provider-gateway"
version = "1.0.0"
description = "Hospital-controlled gateway for federated medical imaging search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
openmed = ["openmed[hf]>=1.9.1"]
dev = ["pytest>=8.0.0"]

[project.scripts]
provider-gateway = "provider_gateway.__main__:main"

[tool.setuptools.packages.find]
where = ["services/provider-gateway"]
include = ["provider_gateway*"]

[tool.setuptools.package-dir]
"" = "services/provider-gateway"

[tool.setuptools.package-data]
provider_gateway = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "services/provider-gateway"]
