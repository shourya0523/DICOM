# Local demo stack.
#
#   docker compose up --build                     # BCH node (:8001) + provider gateway (:8101)
#   docker compose --profile portal up --build    # + MGH/BWH nodes and the portal UI (:8010)
#
# Add further services under `services:` — see the placeholder at the bottom.
name: dicom-demo

x-hospital-node: &hospital-node
  build:
    context: .
    target: hospital-node
  volumes:
    # Edit hospital JSON without rebuilding the image.
    - ./data/hospitals:/app/data/hospitals:ro
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"
    interval: 5s
    timeout: 3s
    retries: 10

services:
  hospital-node:
    <<: *hospital-node
    environment:
      HOSPITAL_NODE: ${PROVIDER_CODE:-BCH}
    ports:
      # Published so the coordinator/portal (or you) can reach the node directly.
      - "${NODE_PORT:-8001}:8001"

  provider-gateway:
    build:
      context: .
      target: gateway
    depends_on:
      hospital-node:
        condition: service_healthy
    environment:
      PROVIDER_CODE: ${PROVIDER_CODE:-BCH}
      PROVIDER_NAME: ${PROVIDER_NAME:-Boston Children's Hospital}
      NODE_URL: http://hospital-node:8001
      DATABASE_PATH: /var/lib/provider-gateway/gateway.db
      TOKEN_SECRET: ${TOKEN_SECRET:?Set TOKEN_SECRET in .env}
      SERVICE_API_KEY: ${SERVICE_API_KEY:?Set SERVICE_API_KEY in .env}
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8101
      OPENMED_FORCE_FALLBACK: ${OPENMED_FORCE_FALLBACK:-1}
      # Used only when the hospital node enforces SSO on /api/studies.
      NODE_SERVICE_ID: ${NODE_SERVICE_ID:-jorgenson@harvard.edu}
      NODE_SERVICE_ORG: ${NODE_SERVICE_ORG:-Harvard University}
      NODE_SERVICE_IRB_APPROVED: ${NODE_SERVICE_IRB_APPROVED:-1}
    ports:
      - "${GATEWAY_PORT:-8101}:8101"
    volumes:
      - gateway-data:/var/lib/provider-gateway
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8101/health')"
      interval: 5s
      timeout: 3s
      retries: 10

  # --- `--profile portal`: the full three-node fan-out demo -------------------
  hospital-node-mgh:
    <<: *hospital-node
    profiles: ["portal"]
    environment:
      HOSPITAL_NODE: MGH
    ports:
      - "${MGH_NODE_PORT:-8002}:8001"

  hospital-node-bwh:
    <<: *hospital-node
    profiles: ["portal"]
    environment:
      HOSPITAL_NODE: BWH
    ports:
      - "${BWH_NODE_PORT:-8003}:8001"

  coordinator:
    build:
      context: .
      target: coordinator
    profiles: ["portal"]
    depends_on:
      provider-gateway:
        condition: service_healthy
    environment:
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
      COORDINATOR_HOST: 0.0.0.0
      COORDINATOR_PORT: 5001
      CORS_ORIGINS: "*"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      HOSPITAL_CODES: BCH,MGH,BWH
      # Real gateway wiring still stubbed in coordinator code; base URL points at BCH for now.
      GATEWAY_BASE_URL: http://provider-gateway:8101
      NODE_BCH_URL: http://hospital-node:8001
      NODE_MGH_URL: http://hospital-node-mgh:8001
      NODE_BWH_URL: http://hospital-node-bwh:8001
    ports:
      - "${COORDINATOR_PORT:-5001}:5001"

  portal:
    build:
      context: .
      target: portal
    profiles: ["portal"]
    depends_on:
      hospital-node:
        condition: service_healthy
      hospital-node-mgh:
        condition: service_healthy
      hospital-node-bwh:
        condition: service_healthy
      coordinator:
        condition: service_started
    environment:
      BCH_URL: http://hospital-node:8001
      MGH_URL: http://hospital-node-mgh:8001
      BWH_URL: http://hospital-node-bwh:8001
      COORDINATOR_URL: http://coordinator:5001
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:-platform-demo-secret-change-me}
    ports:
      - "${PORTAL_PORT:-8010}:8010"

volumes:
  gateway-data:
